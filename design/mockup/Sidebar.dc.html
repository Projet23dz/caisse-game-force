<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["main","business","transactions","treasury"],"default":"main"},"theme":{"editor":"enum","options":["gf-dark","gf-light","gold"],"default":"gf-dark"},"$preview":{"width":260,"height":900}}'>
const THEMES = {
  'gf-dark':  {bg:'#0A0E27',side:'#0E1433',s1:'#141A3D',s2:'#1C2452',line:'rgba(255,255,255,0.08)',tx:'#F5F5F7',mu:'#A9AEC9',br:'#E30613',br2:'#1F2A7A',brTx:'#FFFFFF',glow:'rgba(227,6,19,0.28)',inc:'#34D399',exp:'#FB7185',pur:'#60A5FA',trf:'#FBBF24'},
  'gf-light': {bg:'#F3F4F9',side:'#FFFFFF',s1:'#FFFFFF',s2:'#EDEFF7',line:'rgba(31,42,122,0.12)',tx:'#121633',mu:'#50567A',br:'#D0050F',br2:'#1F2A7A',brTx:'#FFFFFF',glow:'rgba(208,5,15,0.22)',inc:'#15803D',exp:'#BE123C',pur:'#1D4ED8',trf:'#B45309'},
  'gold':     {bg:'#0B0B10',side:'#101017',s1:'#16161E',s2:'#20202B',line:'rgba(255,255,255,0.08)',tx:'#F5F5F7',mu:'#A8A5B5',br:'#D4A23A',br2:'#4A3A16',brTx:'#141414',glow:'rgba(212,162,58,0.25)',inc:'#34D399',exp:'#FB7185',pur:'#60A5FA',trf:'#FBBF24'}
};
function themeVars(k) {
  const t = THEMES[k] || THEMES['gf-dark'];
  return Object.keys(t).map((n) => '--' + n + ':' + t[n]).join(';');
}
class Component extends DCLogic {
  renderVals() {
    const a = this.props.active ?? 'main';
    const c = {};
    ['main', 'business', 'transactions', 'treasury'].forEach((k) => { c[k] = k === a ? 'on' : ''; });
    return { vars: themeVars(this.props.theme ?? 'gf-dark'), c };
  }
}
</script>
</body>
