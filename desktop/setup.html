<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self' data:">
<title>CashPro — الاتصال بالسيرفر</title>
<style>
  :root { --bg:#0A0E27; --s1:#141A3D; --s2:#1C2452; --tx:#F5F5F7; --mu:#A9AEC9; --br:#E30613; --line:rgba(255,255,255,.14); --ok:#34D399; --err:#FB7185; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; color:var(--tx); font-family:"Segoe UI",Tahoma,Arial,sans-serif;
    background: radial-gradient(900px 500px at 85% -10%, rgba(227,6,19,.22), transparent 60%), radial-gradient(900px 600px at 0% 110%, rgba(31,42,122,.7), transparent 60%), var(--bg); }
  .card { width:min(480px, 92vw); background:var(--s1); border:1px solid var(--line); border-radius:20px; padding:30px; display:flex; flex-direction:column; gap:14px; box-shadow:0 10px 30px rgba(0,0,0,.35); }
  .brand { display:flex; align-items:center; gap:12px; } .brand b { font-size:22px; } .brand b span { color:var(--br); }
  h1 { margin:6px 0 0; font-size:20px; } p { margin:0; color:var(--mu); line-height:1.6; font-size:14px; }
  label { display:flex; flex-direction:column; gap:6px; font-size:13px; color:var(--mu); }
  input { min-height:44px; padding:8px 12px; border-radius:11px; border:1px solid var(--line); background:var(--s2); color:var(--tx); font-size:15px; direction:ltr; }
  input:focus { outline:2px solid var(--br); }
  .row { display:flex; gap:8px; }
  button { flex:1; min-height:44px; border-radius:11px; border:1px solid var(--line); background:var(--s2); color:var(--tx); font-weight:700; font-size:14px; cursor:pointer; }
  button.pri { background:var(--br); border-color:transparent; color:#fff; }
  button:disabled { opacity:.5; }
  .msg { padding:10px 12px; border-radius:11px; font-size:13px; display:none; }
  .msg.err { display:block; border:1px solid var(--err); color:var(--err); }
  .msg.ok { display:block; border:1px solid var(--ok); color:var(--ok); }
  .msg.info { display:block; border:1px solid var(--line); color:var(--tx); word-break:break-all; }
  .check { flex-direction:row; align-items:center; gap:10px; color:var(--tx); font-weight:700; font-size:14px; cursor:pointer; }
  .check input { min-height:auto; width:20px; height:20px; accent-color:var(--br); }
  small { color:var(--mu); font-size:12px; line-height:1.6; }
  ul { margin:0; padding-inline-start:18px; color:var(--mu); font-size:13px; line-height:1.8; } code { color:var(--tx); direction:ltr; unicode-bidi:isolate; }
</style>
</head>
<body>
  <form class="card" id="f">
    <div class="brand">
      <svg width="46" height="46" viewBox="0 0 44 44" aria-hidden="true"><rect width="44" height="44" rx="12" fill="#fff"/><g transform="rotate(45 22 22)"><rect x="10" y="10" width="24" height="24" rx="4" fill="#1F2A7A"/><path d="M14 10H34V30Z" fill="#E30613"/></g><circle cx="22" cy="22" r="5.5" fill="none" stroke="#fff" stroke-width="2"/><circle cx="22" cy="22" r="2" fill="#fff"/></svg>
      <b>Cash<span>Pro</span></b>
    </div>
    <h1>الاتصال بسيرفر CashPro</h1>
    <p>أدخل عنوان الجهاز الذي ثُبّت عليه السيرفر. يظهر العنوان في آخر خطوة من تثبيت السيرفر.</p>
    <ul>
      <li>داخل المحل: <code>192.168.1.10:4600</code></li>
      <li>من خارج المحل (عبر Tailscale أو VPN آخر مثبّت على هذا الجهاز): <code>palm01:4600</code> أو <code>100.x.y.z:4600</code></li>
      <li>على السيرفر نفسه: <code>localhost:4600</code></li>
    </ul>
    <div class="msg" id="msg" role="alert"></div>
    <label>عنوان السيرفر / Adresse du serveur
      <input id="url" placeholder="http://192.168.1.10:4600" autocomplete="off" required>
    </label>
    <div class="row">
      <button type="button" id="test">اختبار الاتصال</button>
      <button type="submit" class="pri" id="save">اتصال</button>
    </div>
  </form>
  <script src="setup.js"></script>
</body>
</html>
